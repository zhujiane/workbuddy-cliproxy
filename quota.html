<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkBuddy 配额</title>
<style>body{font:16px system-ui;max-width:960px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#182230}input,button{font:inherit;padding:10px;border:1px solid #abb9cc;border-radius:6px}button{cursor:pointer;background:#125cc5;color:white}article{background:white;border:1px solid #dce2eb;border-radius:12px;padding:20px;margin:18px 0}table{width:100%;text-align:left;border-collapse:collapse}td,th{padding:10px 4px;border-bottom:1px solid #eee}.error{color:#af2424}small{color:#58677b}progress{width:100%}</style>
<h1>WorkBuddy 配额</h1><p>查询 CodeBuddy 个人资源包积分。企业共享配额不在此统计范围内，数据以计费接口为准，可能有延迟。</p>
<form id="form"><input id="key" type="password" autocomplete="off" placeholder="CPA 管理密钥" aria-label="CPA 管理密钥" required><button id="refresh">查询 / 刷新</button></form><p><small>使用管理密钥（不是模型 API Key），仅在当前页面内存中使用。</small></p><p id="status" role="status"></p><main id="accounts"></main>
<script>
const form=document.querySelector('#form'),status=document.querySelector('#status'),accounts=document.querySelector('#accounts'),button=document.querySelector('#refresh');
function node(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='正在查询…';accounts.replaceChildren();try{const r=await fetch('/v0/management/plugins/workbuddy/credits',{headers:{Authorization:'Bearer '+document.querySelector('#key').value.trim()},cache:'no-store'});if(!r.ok)throw Error(r.status===401||r.status===403?'管理密钥无效或无访问权限':'查询失败：HTTP '+r.status);const data=await r.json();for(const a of data.accounts){const card=node('article',undefined,accounts);node('h2',a.name+(a.disabled?'（已禁用）':''),card);node('p',[a.email,a.uid?'UID: '+a.uid:'',a.enterprise_id?'企业: '+a.enterprise_id:''].filter(Boolean).join(' · '),card);if(a.error){node('p','查询失败：'+a.error,card).className='error';continue}const q=a.credits;node('p','剩余 '+q.total_remain+' · 已用 '+q.total_used+' · 总量 '+q.total_size+' 积分',card);if(q.total_size>0){const p=node('progress',undefined,card);p.max=q.total_size;p.value=q.total_remain;p.setAttribute('aria-label','剩余积分')}const table=node('table',undefined,card);const head=node('tr',undefined,node('thead',undefined,table));for(const label of ['资源包','剩余','已用','周期结束'])node('th',label,head);const body=node('tbody',undefined,table);for(const p of q.packages){const row=node('tr',undefined,body);for(const value of [p.name,p.remain,p.used,p.cycle_end||'—'])node('td',value,row)}node('small','查询时间：'+new Date(q.fetched_at).toLocaleString(),card)}status.textContent=data.accounts.length?'查询完成':'没有 WorkBuddy 账号，请先在 CPA 中登录。'}catch(err){status.textContent=err.message}finally{button.disabled=false}});
</script></html>
