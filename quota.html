<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbuddy · Accounts</title>
<style>
:root{font:14px system-ui;color:#243047;background:#f5f7fb;color-scheme:light}*{box-sizing:border-box}body{max-width:1180px;margin:auto;padding:36px 24px}header,.toolbar,.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:28px;letter-spacing:-1px;margin:8px 0}p{line-height:1.6}small,.muted{color:#738095}.eyebrow{color:#5262db;font-size:12px;font-weight:700;letter-spacing:2px}input,button,select{font:inherit;border:1px solid #dce1ec;border-radius:9px;padding:10px 13px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#5262db;color:white;border-color:#5262db}button:disabled{opacity:.55;cursor:wait}input{min-width:220px}form{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin:24px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}article{background:white;border:1px solid #e4e8f0;border-radius:16px;padding:24px;box-shadow:0 4px 16px #22304b04}h2{font-size:18px;margin:0;overflow-wrap:anywhere}.badge{font-size:11px;border-radius:6px;background:#eef0ff;color:#5262db;padding:5px 8px}.badge.cn{background:#e8f5f1;color:#27816b}.identity{font-size:12px;color:#738095;overflow-wrap:anywhere;min-height:36px}.balance{font-size:36px;font-weight:650;letter-spacing:-1px;margin-top:16px}.stats{display:flex;justify-content:space-between;margin:12px 0;color:#738095}progress{width:100%;height:7px;accent-color:#5262db}table{width:100%;text-align:left;border-collapse:collapse;font-size:12px;margin:18px 0}th,td{padding:10px 4px;border-bottom:1px solid #edf0f5}th{color:#738095;font-weight:500}.error{color:#b64444;background:#fff1f1;padding:12px;border-radius:8px}.empty{padding:60px;text-align:center;grid-column:1/-1;color:#738095}#status{min-height:22px;font-size:12px}footer{margin:24px 0;color:#738095;font-size:12px}@media(max-width:540px){body{padding:20px 14px}.grid{grid-template-columns:1fr}article{padding:18px}input{min-width:0;width:100%}form{width:100%}}@media(prefers-color-scheme:dark){:root{background:#141923;color:#e0e5f0;color-scheme:dark}article,input,button,select{background:#1d2533;border-color:#303c50}th,td{border-color:#303c50}.badge{background:#30385e;color:#b7bfff}.badge.cn{background:#234137;color:#8fd8bf}.error{background:#43282d;color:#ffb4b4}}
</style>
<header><div><span class="eyebrow">WORKBUDDY / ACCOUNTS</span><h1>账号与配额</h1><p class="muted">国内与国际账号，一处查看。</p></div><select id="lang" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option></select></header>
<form id="form"><input id="key" type="password" autocomplete="off" placeholder="CPA 管理密钥" aria-label="CPA management key" required><button class="primary" id="refresh">立即刷新</button><button type="button" id="clear">清除缓存</button></form>
<div class="toolbar"><select id="filter" aria-label="Account region"><option value="all">全部账号 / All accounts</option value="workbuddy-cn">Workbuddy-cn · 国内</option><option value="workbuddy">Workbuddy · International</option></select><span class="muted" id="auto"></span></div><p id="status" role="status" aria-live="polite"></p><main class="grid" id="accounts"></main><footer id="foot"></footer>
<script>
const $=s=>document.querySelector(s),cacheKey='workbuddy.accounts.v2',keyName='workbuddy.management.session';let data={accounts:[]},fetched=0,busy=false,lang=navigator.language.startsWith('zh')?'zh':'en';
const tr=(zh,en)=>lang==='zh'?zh:en,fmt=n=>new Intl.NumberFormat(lang).format(n||0);
function node(tag,text,parent,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;if(parent)parent.append(n);return n}
function save(store,k,v){try{store.setItem(k,v)}catch{}}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('h1').textContent=tr('账号与配额','Accounts & credits');$('header p').textContent=tr('国内与国际账号，一处查看。','China and international accounts, in one place.');$('#refresh').textContent=tr('立即刷新','Refresh now');$('#clear').textContent=tr('清除缓存','Clear cache');$('#key').placeholder=tr('CPA 管理密钥','CPA management key');$('#auto').textContent=tr('每 1 分钟自动刷新','Auto-refresh every minute');$('#foot').textContent=tr('统计个人资源包，不含企业共享配额。缓存保存在当前标签页；管理密钥仅在当前标签页会话中保存，关闭后清除。','Personal resource packages only; excludes enterprise shared credits. Cache and management key are stored for this tab session only.');const root=$('#accounts');root.replaceChildren();const list=data.accounts.filter(a=>$('#filter').value==='all'||a.provider===$('#filter').value);if(!list.length)node('div',tr('暂无账号数据，请输入管理密钥刷新。','No accounts to display. Enter your management key and refresh.'),root,'empty');for(const a of list){const card=node('article',undefined,root),head=node('div',undefined,card,'heading');node('h2',a.nickname||a.name,head);node('span',a.provider==='workbuddy-cn'?'Workbuddy-cn':'Workbuddy',head,'badge'+(a.provider==='workbuddy-cn'?' cn':''));node('p',[a.email,a.uid?'UID '+a.uid:'',a.enterprise_id?'Org '+a.enterprise_id:'',a.disabled?tr('已禁用','Disabled'):''].filter(Boolean).join(' · '),card,'identity');node('small',a.auth_index,card);if(a.error){node('p',a.error,card,'error');continue}const q=a.credits;if(!q)continue;node('div',fmt(q.total_remain),card,'balance');node('small',tr('剩余积分','Credits remaining'),card);const stats=node('div',undefined,card,'stats');node('span',tr('已用 ','Used ')+fmt(q.total_used),stats);node('span',tr('总量 ','Total ')+fmt(q.total_size),stats);if(q.total_size>0){const p=node('progress',undefined,card);p.max=q.total_size;p.value=q.total_remain;p.setAttribute('aria-label',tr('剩余积分','Credits remaining'))}const table=node('table',undefined,card),headrow=node('tr',undefined,node('thead',undefined,table));for(const label of [tr('资源包','Package'),tr('剩余','Remaining'),tr('周期结束','Cycle end')])node('th',label,headrow);const body=node('tbody',undefined,table);for(const p of q.packages||[]){const row=node('tr',undefined,body);for(const val of [p.name,fmt(p.remain),p.cycle_end||'—'])node('td',val,row)}node('small',tr('更新于 ','Updated ')+new Date(q.fetched_at).toLocaleString(),card)}if(fetched)$('#status').textContent=tr('缓存数据 · 上次更新 ','Cached data · Last updated ')+new Date(fetched).toLocaleString()}
async function refresh(){if(busy||!$('#key').value.trim())return;busy=true;$('#refresh').disabled=true;$('#status').textContent=tr('正在更新，保留上次结果…','Updating; keeping previous results…');try{const key=$('#key').value.trim();const r=await fetch('/v0/management/plugins/workbuddy/credits',{headers:{Authorization:'Bearer '+key},cache:'no-store'});if(!r.ok)throw Error(r.status===401||r.status===403?tr('管理密钥无效或无权限','Invalid management key or access denied'):'HTTP '+r.status);const next=await r.json();if(!Array.isArray(next.accounts))throw Error('Invalid response');data=next;fetched=Date.now();save(sessionStorage,keyName,key);save(sessionStorage,cacheKey,JSON.stringify({data,fetched}));render()}catch(e){$('#status').textContent=tr('更新失败，保留缓存：','Update failed; cached results retained: ')+e.message}finally{busy=false;$('#refresh').disabled=false}}
try{const cached=JSON.parse(sessionStorage.getItem(cacheKey)||'null');if(cached&&Array.isArray(cached.data.accounts)){data=cached.data;fetched=cached.fetched}$('#key').value=sessionStorage.getItem(keyName)||'';lang=sessionStorage.getItem('workbuddy.lang')||lang}catch{}
$('#lang').value=lang;$('#lang').onchange=()=>{lang=$('#lang').value;save(sessionStorage,'workbuddy.lang',lang);render()};$('#filter').onchange=render;$('#form').onsubmit=e=>{e.preventDefault();refresh()};$('#clear').onclick=()=>{sessionStorage.removeItem(cacheKey);sessionStorage.removeItem(keyName);$('#key').value='';data={accounts:[]};fetched=0;$('#status').textContent='';render()};render();if(Date.now()-fetched>=60000)refresh();setInterval(refresh,60000);
</script></html>
